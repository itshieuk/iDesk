name: iDesk
options:
  bundleIdPrefix: com.hieuk
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
targets:
  iDesk:
    type: application
    platform: iOS
    sources: [iDesk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hieuk.idesk
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: iDesk/iDesk-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: iDesk/Info.plist
      properties:
        CFBundleDisplayName: iDesk
        # From the build settings, so scripts/build-ipa.sh (VERSION / BUILD_NUMBER) and releases set them.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Apps loaded into iDesk ask for permissions as iDesk: iOS terminates an app that requests one
        # without its description in Info.plist, so declare them all.
        NSCameraUsageDescription: An app running in iDesk needs this permission.
        NSMicrophoneUsageDescription: An app running in iDesk needs this permission.
        NSPhotoLibraryUsageDescription: An app running in iDesk needs this permission.
        NSPhotoLibraryAddUsageDescription: Saves screenshots of the desktop, and photos from apps running in iDesk.
        NSLocationWhenInUseUsageDescription: An app running in iDesk needs this permission.
        NSLocationAlwaysAndWhenInUseUsageDescription: An app running in iDesk needs this permission.
        NSLocationAlwaysUsageDescription: An app running in iDesk needs this permission.
        NSContactsUsageDescription: An app running in iDesk needs this permission.
        NSCalendarsUsageDescription: An app running in iDesk needs this permission.
        NSCalendarsFullAccessUsageDescription: An app running in iDesk needs this permission.
        NSCalendarsWriteOnlyAccessUsageDescription: An app running in iDesk needs this permission.
        NSRemindersUsageDescription: An app running in iDesk needs this permission.
        NSRemindersFullAccessUsageDescription: An app running in iDesk needs this permission.
        NSBluetoothAlwaysUsageDescription: An app running in iDesk needs this permission.
        NSBluetoothPeripheralUsageDescription: An app running in iDesk needs this permission.
        NSLocalNetworkUsageDescription: An app running in iDesk needs this permission.
        NSMotionUsageDescription: An app running in iDesk needs this permission.
        NSSpeechRecognitionUsageDescription: An app running in iDesk needs this permission.
        NSFaceIDUsageDescription: An app running in iDesk needs this permission.
        NSAppleMusicUsageDescription: An app running in iDesk needs this permission.
        NSUserTrackingUsageDescription: An app running in iDesk needs this permission.
        NSHealthShareUsageDescription: An app running in iDesk needs this permission.
        NSHealthUpdateUsageDescription: An app running in iDesk needs this permission.
        NSHomeKitUsageDescription: An app running in iDesk needs this permission.
        NSNearbyInteractionUsageDescription: An app running in iDesk needs this permission.
        NSSensorKitUsageDescription: An app running in iDesk needs this permission.
        NFCReaderUsageDescription: An app running in iDesk needs this permission.
        NSFocusStatusUsageDescription: An app running in iDesk needs this permission.
        NSIdentityUsageDescription: An app running in iDesk needs this permission.
        # Allow "Open in iDesk" for .ipa files
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.itunes.ipa]
        LSSupportsOpeningDocumentsInPlace: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Phone
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).PhoneSceneDelegate
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalSceneDelegate
