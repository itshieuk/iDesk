name: Build

# Builds the unsigned IPA only when started by hand (Actions › Build › Run workflow). Releases build on their own
# when a v* tag is pushed, so pushes to main and pull requests don't use Actions minutes.
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: BUILD_NUMBER=${{ github.run_number }} scripts/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iDesk-${{ github.sha }}
          path: build/iDesk.ipa
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
